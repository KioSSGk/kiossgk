name: Build Image

on:
    pull_request:
        branches:
            - 'main'

    push:
        branches:
            - 'main'
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v4
    -
      name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    -
      name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    -
      name: Build and push
      uses: docker/build-push-action@v6
      with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kiossgk:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_API_KEY=${{ secrets.NEXT_PUBLIC_API_KEY }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}

    - 
        name: SSH Remote Commands
        uses: appleboy/ssh-action@v1.0.3     
        with:
            host: 54.178.207.36
            username: ${{ secrets.SSH_USERNAME }}
            key: ${{ secrets.SSH_KEY }}
            port: 22
            timeout: 40s  # 30초 기본        
            script: |
                docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kiossgk:latest
                docker rm -f kiossgk
                docker run -d --restart=always -p 80:3000 --name kiossgk \
                  -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
                  -e DB_HOST="${{ secrets.DB_HOST }}" \
                  -e DB_USER="${{ secrets.DB_USER }}" \
                  -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
                  -e DB_DATABASE="${{ secrets.DB_DATABASE }}" \
                  -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                  -e TOSS_SECRET_KEY="${{ secrets.TOSS_SECRET_KEY }}" \
                  ${{ secrets.DOCKERHUB_USERNAME }}/kiossgk:latest


  pr-build:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v4
    -
      name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    -
      name: Build (PR)
      uses: docker/build-push-action@v6
      with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false  # PR 빌드에서는 이미지를 푸시하지 않음
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kiossgk:pr-${{ github.event.number }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_API_KEY=${{ secrets.NEXT_PUBLIC_API_KEY }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
